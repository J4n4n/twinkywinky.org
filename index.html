<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#fff5f8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E⭐%3C/text%3E%3C/svg%3E" />
  <title>TwinkyWinky — اتاق آستولفو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app" class="app-shell" aria-label="اتاق تعاملی آستولفو">
    <!-- نوار وضعیت بالا -->
    <header class="hud-top">
      <div class="hud-row">
        <div class="pill pill-profile">
          <span class="badge-dot">🌸</span>
          <strong id="hud-name">آستولفو</strong>
          <span class="sep">·</span>
          <span id="hud-level">سطح ۱</span>
        </div>

        <div class="pill pill-day" id="hud-day">روز ۱</div>

        <div class="pill pill-coins" title="سکه‌ها">
          <span class="coin-ico">🪙</span>
          <span id="hud-coins">50</span>
        </div>

        <button id="btn-sound" class="icon-btn" type="button" aria-label="قطع و وصل صدا" title="صدا">
          🔊
        </button>
      </div>

      <div class="hud-stats">
        <div class="stat-chip" title="محبت">
          <span>💖</span>
          <div class="stat-bar"><i id="bar-love" style="width: 75%"></i></div>
          <small id="val-love">75</small>
        </div>
        <div class="stat-chip" title="سیر بودن">
          <span>🍓</span>
          <div class="stat-bar"><i id="bar-hunger" style="width: 80%"></i></div>
          <small id="val-hunger">80</small>
        </div>
        <div class="stat-chip" title="انرژی">
          <span>✨</span>
          <div class="stat-bar"><i id="bar-energy" style="width: 85%"></i></div>
          <small id="val-energy">85</small>
        </div>
      </div>
    </header>

    <!-- صحنه‌ی اتاق و کاراکتر -->
    <section id="room-stage" class="room-stage">
      <img id="room-bg-day" class="room-bg active" src="assets/room-day.png" alt="اتاق روز" draggable="false" />
      <img id="room-bg-night" class="room-bg" src="assets/room-night.png" alt="اتاق شب" draggable="false" />
      <div class="night-vignette" aria-hidden="true"></div>

      <!-- حباب گفتگوی فارسی (در ناحیه‌ی امن بالا بدون افتادن روی سر کاراکتر) -->
      <div id="speech-bubble" class="speech-bubble" role="status" aria-live="polite">
        <span id="speech-text">سلام! خوش اومدی به اتاقم 🌸</span>
      </div>

      <!-- سایه‌ی نرم زیر پای کاراکتر روی فرش -->
      <div id="char-shadow" class="char-shadow" aria-hidden="true"></div>

      <!-- کانواس رندر شفاف کاراکتر (بدن ثابت، فقط حرکت سر و پلک و تغییر ژست نشستن/خواب) -->
      <canvas id="char-canvas" class="char-canvas" width="600" height="900"></canvas>

      <!-- لایه‌ی افکت‌ها (قلب‌ها، جرقه‌ها، Zzz) -->
      <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>

      <!-- نواحی تعاملی دقیق روی اتاق و کاراکتر -->
      <button id="hs-shelf" class="hotspot hs-shelf" type="button" aria-label="لمس قفسه کتاب" title="قفسه کتاب"></button>
      <button id="hs-clock" class="hotspot hs-clock" type="button" aria-label="لمس ساعت دیواری" title="ساعت دیواری"></button>
      <button id="hs-poster" class="hotspot hs-poster" type="button" aria-label="لمس پوستر ستاره" title="پوستر"></button>
      <button id="hs-lamp" class="hotspot hs-lamp" type="button" aria-label="روشن و خاموش کردن چراغ" title="چراغ"></button>
      <button id="hs-rug" class="hotspot hs-rug" type="button" aria-label="لمس فرش برای نشستن چهارزانو" title="نشستن روی فرش"></button>
      <button id="hs-bunny" class="hotspot hs-bunny" type="button" aria-label="لمس عروسک خرگوشی" title="خرگوشی"></button>
      <button id="hs-bowl" class="hotspot hs-bowl" type="button" aria-label="لمس کاسه غذا" title="غذا دادن"></button>
      <button id="hs-head" class="hotspot hs-head" type="button" aria-label="ناز کردن سر آستولفو" title="ناز کردن سر"></button>

      <!-- دکمه‌های سریع کناری -->
      <div class="side-tools">
        <button id="btn-open-chatlog" class="side-pill" type="button" title="تاریخچه چت">💬</button>
        <button id="btn-open-rank" class="side-pill" type="button" title="لیدربورد">🏆</button>
        <button id="btn-open-shop" class="side-pill" type="button" title="فروشگاه">🛍️</button>
      </div>
    </section>

    <!-- کنترل‌های پایین و چت داخل سایت -->
    <footer class="bottom-panel">
      <nav class="action-dock" aria-label="اکشن‌ها">
        <button id="act-pet" class="dock-btn" type="button">
          <span class="dock-ico">💗</span>
          <span>ناز کردن</span>
        </button>
        <button id="act-sit" class="dock-btn" type="button">
          <span class="dock-ico">🪑</span>
          <span id="sit-label">چهارزانو</span>
        </button>
        <button id="act-sleep" class="dock-btn" type="button">
          <span class="dock-ico">🌙</span>
          <span id="sleep-label">خواب</span>
        </button>
        <button id="act-game" class="dock-btn" type="button">
          <span class="dock-ico">🎮</span>
          <span>بازی</span>
        </button>
        <button id="act-shop" class="dock-btn" type="button">
          <span class="dock-ico">🛍️</span>
          <span>فروشگاه</span>
        </button>
      </nav>

      <form id="chat-form" class="chat-bar" autocomplete="off">
        <input id="chat-input" type="text" maxlength="120" placeholder="به آستولفو یه چیزی بگو..." />
        <button class="chat-send" type="submit" aria-label="ارسال پیام">➤</button>
      </form>
    </footer>

    <!-- مودال‌ها -->
    <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
      <!-- فروشگاه -->
      <div id="modal-shop" class="modal-card hidden">
        <div class="modal-head">
          <h2>🛍️ فروشگاه اتاق</h2>
          <div class="modal-coins">🪙 <span id="shop-coins">50</span></div>
          <button class="modal-close" data-close type="button" aria-label="بستن">✕</button>
        </div>
        <div id="shop-tabs" class="chip-tabs">
          <button class="chip-tab active" data-cat="all" type="button">همه</button>
          <button class="chip-tab" data-cat="food" type="button">خوراکی</button>
          <button class="chip-tab" data-cat="gift" type="button">هدیه و اکسسوری</button>
          <button class="chip-tab" data-cat="decor" type="button">وسایل اتاق</button>
        </div>
        <div id="shop-grid" class="shop-grid"></div>
      </div>

      <!-- مینی‌گیم ستاره‌چین -->
      <div id="modal-game" class="modal-card hidden">
        <div class="modal-head">
          <h2>🎮 ستاره‌چین آستولفو</h2>
          <button class="modal-close" data-close type="button" aria-label="بستن">✕</button>
        </div>
        <div class="game-hud">
          <span>امتیاز: <strong id="game-score">0</strong></span>
          <span>زمان: <strong id="game-timer">30</strong> ثانیه</span>
          <span>رکورد: <strong id="game-best">0</strong></span>
        </div>
        <div class="game-wrap">
          <canvas id="game-canvas" width="380" height="360"></canvas>
          <div id="game-overlay" class="game-overlay">
            <p id="game-status">ستاره‌ها ⭐ و قلب‌ها 💖 رو بگیر و از ابرهای خواب‌آلود ☁️ دوری کن!</p>
            <button id="btn-game-start" class="primary-btn" type="button">شروع بازی</button>
          </div>
        </div>
      </div>

      <!-- لیدربورد -->
      <div id="modal-rank" class="modal-card hidden">
        <div class="modal-head">
          <h2>🏆 لیدربورد</h2>
          <button class="modal-close" data-close type="button" aria-label="بستن">✕</button>
        </div>
        <div class="name-row">
          <input id="player-name-input" type="text" maxlength="18" placeholder="نام نمایشی تو..." />
          <button id="btn-save-name" class="primary-btn small" type="button">ذخیره</button>
        </div>
        <div id="rank-list" class="rank-list"></div>
      </div>

      <!-- تاریخچه چت -->
      <div id="modal-chat" class="modal-card hidden">
        <div class="modal-head">
          <h2>💬 گفتگوی من و آستولفو</h2>
          <button class="modal-close" data-close type="button" aria-label="بستن">✕</button>
        </div>
        <div id="chat-log-list" class="chat-log-list"></div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
