<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بزودی | twinkywinky.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#f6d7e3;font-family:'Vazirmatn',system-ui,sans-serif}
  #stage{position:fixed;inset:0}
  #stage canvas{display:block;opacity:0;transition:opacity .6s ease}
  #stage canvas.ready{opacity:1}
  #poster{position:fixed;inset:0;width:100%;height:100%;object-fit:contain;background:#f6d7e3;transition:opacity .6s ease}
  #poster.gone{opacity:0;pointer-events:none}
  #st{position:fixed;top:0;left:0;opacity:0;pointer-events:none;font-size:1px}
  header{position:fixed;top:0;left:0;right:0;z-index:5;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 16px 0;pointer-events:none}
  h1{margin:0;font-size:clamp(24px,5.4vw,44px);font-weight:900;color:#3d2b33;line-height:1.5;text-shadow:0 2px 12px rgba(246,215,227,.9)}
  h1 .fem{color:#e75480;position:relative;white-space:nowrap}
  h1 .fem::after{content:"";position:absolute;left:0;right:0;bottom:.08em;height:.32em;background:#f7a8c4;opacity:.55;border-radius:99px;z-index:-1}
  #loadbar{position:fixed;top:0;left:0;height:3px;width:0;background:#e75480;z-index:8;transition:width .2s ease}
  #loadmsg{position:fixed;top:calc(50% - 14px);left:0;right:0;text-align:center;color:#a34d6d;font-size:15px;z-index:4;pointer-events:none}
  #ui{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:10px;justify-content:center;z-index:5}
  #ui button{font:inherit;font-size:16px;font-weight:700;padding:12px 26px;border-radius:999px;border:2px solid #e58aa8;background:rgba(255,255,255,.92);color:#c24b78;cursor:pointer;min-height:48px;box-shadow:0 4px 16px rgba(194,75,120,.18);transition:background .2s,color .2s}
  #ui button.on{background:#f7a8c4;color:#fff;border-color:#f7a8c4}
  #ui button:disabled{opacity:.45;cursor:wait}
  #hint{position:fixed;bottom:calc(82px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#a34d6d;font-size:14px;z-index:5;pointer-events:none;text-shadow:0 1px 8px rgba(246,215,227,.9)}
  footer{position:fixed;bottom:calc(4px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#b98a9a;font-size:11px;z-index:4;pointer-events:none}
  #hearts{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:6}
  #hearts span{position:absolute;font-size:26px;color:#ff5c8a;animation:up 1.2s ease-out forwards;text-shadow:0 1px 4px rgba(0,0,0,.2)}
  @keyframes up{from{transform:translateY(0) scale(.7);opacity:1}to{transform:translateY(-90px) scale(1.2);opacity:0}}
  @media (prefers-reduced-motion: reduce){ #stage canvas{transition:none} }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/loaders/GLTFLoader.js":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js","three/addons/controls/OrbitControls.js":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js"}}</script>
</head>
<body>
<div id="st">loading…</div>
<div id="loadbar"></div>
<div id="loadmsg">در حال بارگذاری…</div>
<img id="poster" src="poster.png" alt="" fetchpriority="high">
<div id="stage"></div>
<header><h1>بزودی در این سایت <span class="fem">فمبوی</span> نصب می گردد.</h1></header>
<div id="hint">برای ناز کردن، سرش رو لمس کن &nbsp;·&nbsp; برای چرخوندن بکشید</div>
<div id="ui">
  <button data-clip="Idle" class="on" disabled>وایسا</button>
  <button data-clip="Sit" disabled>بشین</button>
  <button data-clip="Pet" disabled>♥ نازش کن</button>
</div>
<div id="hearts"></div>
<footer>مدل سه‌بعدی: Low Poly Saber Astolfo — Crashsune · ساخته‌شده با Three.js</footer>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const st=document.getElementById('st');
const bar=document.getElementById('loadbar');
const loadmsg=document.getElementById('loadmsg');
const poster=document.getElementById('poster');
const q=new URLSearchParams(location.search);
const az=parseFloat(q.get('az')||'0')*Math.PI/180;
const startClip=q.get('clip')||'Idle';
const noui=q.get('noui')==='1';
if(noui){ document.getElementById('ui').style.display='none'; document.querySelector('header').style.display='none'; document.getElementById('hint').style.display='none'; document.querySelector('footer').style.display='none'; }
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.0;
stage.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf6d7e3);
const camera=new THREE.PerspectiveCamera(35,1,0.1,100);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.enablePan=false;
controls.minDistance=1.8; controls.maxDistance=5;
controls.minPolarAngle=Math.PI*0.15; controls.maxPolarAngle=Math.PI*0.55;
controls.autoRotate=(q.get('spin')!=='0'); controls.autoRotateSpeed=0.7;
let resumeT=null;
controls.addEventListener('start',()=>{controls.autoRotate=false;clearTimeout(resumeT);});
controls.addEventListener('end',()=>{resumeT=setTimeout(()=>controls.autoRotate=true,3000);});
scene.add(new THREE.HemisphereLight(0xffffff,0xe8a0b8,1.6));
const sun=new THREE.DirectionalLight(0xffffff,2.2); sun.position.set(2,3,2); scene.add(sun);
const sun2=new THREE.DirectionalLight(0xffd9e8,1.0); sun2.position.set(-2,3,2); scene.add(sun2);
// soft contact shadow disc
const _cv=document.createElement('canvas'); _cv.width=_cv.height=256;
const _g=_cv.getContext('2d'); const _gr=_g.createRadialGradient(128,128,10,128,128,120);
_gr.addColorStop(0,'rgba(120,40,70,0.35)'); _gr.addColorStop(1,'rgba(120,40,70,0)');
_g.fillStyle=_gr; _g.fillRect(0,0,256,256);
const ground=new THREE.Mesh(new THREE.CircleGeometry(0.6,32), new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(_cv),transparent:true,depthWrite:false}));
ground.rotation.x=-Math.PI/2; ground.position.y=0.002; scene.add(ground);
const heartsBox=document.getElementById('hearts');
function spawnHeart(x,y){
  if(heartsBox.childElementCount>14) return;
  const sp=document.createElement('span'); sp.textContent='♥';
  sp.style.left=(x+(Math.random()*40-20))+'px'; sp.style.top=y+'px';
  heartsBox.appendChild(sp); setTimeout(()=>sp.remove(),1300);
}
function setActiveButton(name){
  document.querySelectorAll('#ui button').forEach(b=>b.classList.toggle('on', b.dataset.clip===name));
}
function enableButtons(){ document.querySelectorAll('#ui button').forEach(b=>b.disabled=false); }
let mixer=null, actions={}, current=null, base='Idle', petReturn=null, headBone=null;
function playLoop(name, dur=0.5){
  const next=actions[name]; if(!next||next===current) return;
  next.reset().fadeIn(dur).play();
  if(current) current.fadeOut(dur);
  current=next; base=name; setActiveButton(name);
}
function headScreenPos(){
  if(!headBone) return null;
  const v=headBone.getWorldPosition(new THREE.Vector3()); v.project(camera);
  const r=renderer.domElement.getBoundingClientRect();
  return {x:(v.x*0.5+0.5)*r.width, y:(-v.y*0.5+0.5)*r.height, behind:v.z>1};
}
function playPet(){
  if(!actions.Pet||current===actions.Pet) return;
  petReturn=base;
  const pet=actions.Pet;
  pet.reset().fadeIn(0.25).play();
  if(current) current.fadeOut(0.25);
  current=pet; setActiveButton('Pet');
  const hp=headScreenPos(); if(hp&&!hp.behind){ for(let i=0;i<4;i++) setTimeout(()=>spawnHeart(hp.x,hp.y-30), i*150); }
}
function fitCamera(){
  renderer.setSize(innerWidth,innerHeight);
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize',()=>{ fitCamera(); });
const manager=new THREE.LoadingManager();
manager.onProgress=(_u,loaded,total)=>{ bar.style.width=(100*loaded/total)+'%'; };
manager.onError=()=>{ loadmsg.textContent='بارگذاری مدل ناموفق بود — لطفا صفحه را تازه کنید.'; };
const loader=new GLTFLoader(manager);
loader.load('astolfo_animated.glb', g=>{
  const m=g.scene; scene.add(m);
  m.traverse(o=>{ if(o.isMesh){ o.castShadow=false; o.receiveShadow=false; } });
  scene.updateMatrixWorld(true);
  const box=new THREE.Box3();
  m.traverse(o=>{ if(o.isSkinnedMesh){ o.skeleton.update(); o.computeBoundingBox(); box.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
  if(!box.isEmpty()){ m.position.y-=box.min.y; scene.updateMatrixWorld(true); }
  const box2=new THREE.Box3();
  m.traverse(o=>{ if(o.isSkinnedMesh){ o.computeBoundingBox(); box2.union(o.boundingBox.clone().applyMatrix4(o.matrixWorld)); } });
  if(box2.isEmpty()) box2.setFromObject(m);
  const ctr=box2.getCenter(new THREE.Vector3()); ctr.x-=0.15; const size=box2.getSize(new THREE.Vector3());
  const maxDim=Math.max(size.x,size.y,size.z);
  let dist=maxDim*2.8;
  fitCamera();
  if(camera.aspect<1) dist*=1.25;
  const dir=new THREE.Vector3(Math.sin(az),0.18,Math.cos(az)).normalize();
  camera.position.copy(ctr).addScaledVector(dir,dist);
  controls.target.copy(ctr); controls.update();
  mixer=new THREE.AnimationMixer(m);
  for(const clip of g.animations){
    if(clip.name==='rigAction') continue;
    actions[clip.name]=mixer.clipAction(clip);
  }
  actions.Pet.setLoop(THREE.LoopOnce,1); actions.Pet.clampWhenFinished=true;
  mixer.addEventListener('finished', e=>{ if(e.action===actions.Pet) playLoop(petReturn||'Idle',0.4); });
  m.traverse(o=>{ if(o.isBone && /head$/i.test(o.name)) headBone=o; });
  const headHit=new THREE.Mesh(new THREE.SphereGeometry(0.24,8,8), new THREE.MeshBasicMaterial({visible:false}));
  (headBone||m).add(headHit);
  const ray=new THREE.Raycaster(), ptr=new THREE.Vector2();
  let downX=0, downY=0, downT=0;
  renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); controls.autoRotate=false; });
  renderer.domElement.addEventListener('pointerup', e=>{
    const moved=Math.hypot(e.clientX-downX, e.clientY-downY);
    if(moved>7 || performance.now()-downT>400) return;
    const rect=renderer.domElement.getBoundingClientRect();
    ptr.set(((e.clientX-rect.left)/rect.width)*2-1, -((e.clientY-rect.top)/rect.height)*2+1);
    ray.setFromCamera(ptr, camera);
    if(ray.intersectObject(headHit,false).length) playPet();
  });
  document.querySelectorAll('#ui button').forEach(btn=>btn.addEventListener('click', ()=>{
    const name=btn.dataset.clip;
    if(name==='Pet') playPet(); else playLoop(name, name==='Sit'?0.6:0.4);
  }));
  playLoop('Idle',0);
  renderer.domElement.classList.add('ready');
  poster.classList.add('gone');
  loadmsg.style.display='none';
  bar.style.display='none';
  enableButtons();
  st.textContent='OK clips='+Object.keys(actions).join(',');
  document.title='LOADED';
  if(startClip==='Sit'){ setTimeout(()=>{ playLoop('Sit',0.6); setTimeout(()=>{ st.textContent='OK sit'; }, 900); }, 300); }
  else if(startClip==='Pet'){ setTimeout(()=>{ playPet(); setTimeout(()=>{ st.textContent='OK pet'; }, 650); }, 300); }
}, undefined, e=>{ st.textContent='ERR '+(e.message||e); loadmsg.textContent='بارگذاری مدل ناموفق بود.'; });
const clock=new THREE.Clock();
(function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);
  if(mixer) mixer.update(dt);
  controls.update(); renderer.render(scene,camera);
})();
</script>
</body>
</html>
