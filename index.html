<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>twinkywinky.org</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111111'/%3E%3Ctext x='32' y='42' font-size='28' font-weight='900' fill='%23FF3E8A' text-anchor='middle' font-family='sans-serif'%3ETW%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%;background:#F6F4F5;font-family:system-ui,'Vazirmatn',sans-serif;color:#111}
  .checker{height:16px;background:conic-gradient(#111 25%,#fff 0 50%,#111 0 75%,#fff 0);background-size:16px 16px}
  main{max-width:720px;margin:0 auto;padding:22px 20px 32px;text-align:center}
  .domain{font-weight:900;letter-spacing:.14em;font-size:15px}
  .headline{font-size:23px;font-weight:800;margin:16px 0 0;line-height:1.7}
  .frame{margin:18px auto 0;width:min(100%,340px);height:min(54dvh,620px);position:relative;background:#fff;border:2px solid #111;box-shadow:12px 12px 0 #FF3E8A}
  .frame img{width:100%;height:100%;object-fit:contain;display:block}
  .playwrap{margin-top:22px;text-align:center}
  .play{width:76px;height:76px;border-radius:50%;border:3px solid #111;background:#FF3E8A;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;box-shadow:6px 6px 0 #111}
  .play span{width:0;height:0;border-left:26px solid #fff;border-top:15px solid transparent;border-bottom:15px solid transparent;margin-left:6px}
  .playlabel{margin-top:10px;font-size:13px;font-weight:700;color:#111}
  .modal{position:fixed;inset:0;background:#F6F4F5;z-index:10;display:none;flex-direction:column;height:100dvh}
  .modal.open{display:flex}
  .modal header{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid #111}
  .modal header b{font-size:15px}
  .modal header button{font:inherit;font-weight:800;background:#fff;border:2px solid #111;padding:8px 16px;cursor:pointer}
  #stage{flex:1;min-height:0;position:relative;touch-action:none}
  #stage canvas{display:block;width:100%;height:100%}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;pointer-events:none;animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .controls{flex:0 0 auto;padding:14px;display:flex;gap:10px;justify-content:center;align-items:center;border-top:2px solid #111;flex-wrap:wrap}
  .controls button{font:inherit;font-weight:800;background:#fff;border:2px solid #111;padding:10px 18px;cursor:pointer;min-height:44px}
  .controls button.on{background:#FF3E8A;color:#fff}
  .hint{font-size:13px;font-weight:700;color:#555}
</style>
</head>
<body>
<div class="checker"></div>
<main>
  <div class="domain">TWINKYWINKY.ORG</div>
  <h1 class="headline">بزودی در این سایت فمبوی نصب می گردد.</h1>
  <div class="frame">
    <img src="1000035308_0_df1g.png" alt="کاراکتر">
  </div>
  <div class="playwrap">
    <button class="play" id="playBtn" aria-label="نمای ۳۶۰ درجه"><span></span></button>
    <div class="playlabel">نمای ۳۶۰ درجه</div>
  </div>
</main>
<div class="modal" id="modal">
  <header><b>نمای ۳۶۰ درجه کاراکتر</b><button id="closeBtn">بستن</button></header>
  <div id="stage"><div id="load">در حال بارگذاری مدل… <span id="pct"></span></div></div>
  <div class="controls"><span class="hint">برای چرخش، کاراکتر را بکشید</span><button id="rotBtn" class="on">چرخش خودکار</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
const modal=document.getElementById('modal'), stage=document.getElementById('stage'),
  load=document.getElementById('load'), pct=document.getElementById('pct'),
  rotBtn=document.getElementById('rotBtn');
let renderer, scene, camera, controls, model, started=false, auto=true;
function init(){
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  stage.appendChild(renderer.domElement);
  scene=new THREE.Scene(); scene.background=new THREE.Color(0xF6F4F5);
  camera=new THREE.PerspectiveCamera(35,1,0.1,100); camera.position.set(0,1.2,4.2);
  scene.add(new THREE.HemisphereLight(0xffffff,0xdddddd,1.2));
  const key=new THREE.DirectionalLight(0xffffff,1.6); key.position.set(2,4,3); scene.add(key);
  const fill=new THREE.DirectionalLight(0xffd9e8,0.5); fill.position.set(-3,1,-2); scene.add(fill);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enablePan=false; controls.enableDamping=true; controls.autoRotate=true; controls.autoRotateSpeed=1.2;
  controls.minDistance=2; controls.maxDistance=8;
  new GLTFLoader().load('model_0_ht7f.glb',g=>{
    model=g.scene; scene.add(model);
    const box=new THREE.Box3().setFromObject(model), c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
    model.position.sub(c); model.position.y+=0.1;
    const maxDim=Math.max(s.x,s.y,s.z); camera.position.set(0,0.4,maxDim*1.9);
    controls.target.set(0,0,0); load.style.display='none';
    animate();
  },e=>{ if(e.total) pct.textContent=Math.round(e.loaded/e.total*100)+'٪'; },()=>{ load.textContent='مدل بارگذاری نشد.'; });
  const resize=()=>{ const w=stage.clientWidth,h=stage.clientHeight; renderer.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix(); };
  new ResizeObserver(resize).observe(stage); resize();
}
function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
document.getElementById('playBtn').onclick=()=>{ modal.classList.add('open'); if(!started){started=true;init();} };
document.getElementById('closeBtn').onclick=()=>modal.classList.remove('open');
rotBtn.onclick=()=>{ auto=!auto; controls.autoRotate=auto; rotBtn.classList.toggle('on',auto); };
</script>
</body>
</html>
