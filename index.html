<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>آستولفو — twinkywinky.org</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/star-pink.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <div class="room-wrap" id="roomWrap">
    <div class="room" id="room">
      <div class="floor-band"></div>
      <img class="rug-img" id="rug-img" src="assets/props/rug.png" alt="">
      <div class="lamp-glow" id="lamp-glow"></div>

      <div class="prop" id="p-window" title="پنجره">
        <img class="win-img win-closed" id="win-closed" src="assets/props/window-closed.png" alt="">
        <img class="win-img win-open" id="win-open" src="assets/props/window-open.png" alt="" style="display:none">
      </div>
      <div class="curtain l"></div><div class="curtain r"></div>
      <div id="fairy-lights"></div>

      <img class="prop" id="p-shelf" src="assets/props/shelf.png" alt="قفسه">
      <img class="prop" id="p-books" src="assets/props/books.png" alt="کتاب‌ها">
      <img class="prop" id="p-plant" src="assets/props/plant.png" alt="گلدان">

      <div class="prop" id="p-clock" title="ساعت">
        <img class="clock-face" src="assets/props/clock-face.png" alt="">
        <img class="clock-hand" id="clock-hour" src="assets/props/clock-hand-hour.png" alt="">
        <img class="clock-hand" id="clock-minute" src="assets/props/clock-hand-minute.png" alt="">
      </div>
      <img class="prop" id="p-poster" src="assets/props/poster.png" alt="پوستر">
      <img class="prop" id="p-lamp" src="assets/props/lamp-off.png" alt="چراغ">
      <img class="prop" id="p-plush" src="assets/props/plush-bunny.png" alt="عروسک">
      <img class="prop" id="p-ball" src="assets/props/ball.png" alt="توپ">
      <img class="prop" id="p-musicbox" src="assets/props/music-box-closed.png" alt="جعبه موزیک">
      <img class="prop" id="p-bowl" src="assets/props/bowl-empty.png" alt="کاسه غذا">
      <img class="prop" id="p-diary" src="assets/props/diary.png" alt="دفتر خاطرات">
      <img id="falling-book" src="assets/props/books.png" alt="">

      <canvas id="charCanvas" width="390" height="600"></canvas>
      <div id="sleep-veil"></div>
      <div id="sleep-z"><span>Z</span><span>Z</span><span>Z</span></div>
      <div id="droplets"></div>
      <div id="hearts"></div>

      <div class="hud">
        <div class="pill"><img src="assets/icons/star-pink.png" alt=""> آستولفو <span id="stage-pill" style="color:var(--muted);font-weight:400">· مرحله ۱</span></div>
        <div class="pill">روز <span class="px-num" id="day-val">1</span></div>
        <div class="pill"><img class="coin-ic" src="assets/icons/coin.png" alt=""> <span class="px-num" id="coins-val">20</span></div>
        <button id="gear-btn" title="تنظیمات"><img src="assets/icons/gear.png" alt="تنظیمات"></button>
      </div>
      <div class="rings">
        <div class="ring-cluster" id="rings-right">
          <div class="ring" data-meter="energy"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" cx="18" cy="18" r="15.5" stroke="#F2B705" stroke-dasharray="97.4" stroke-dashoffset="19.5" stroke-linecap="round"/></svg><img src="assets/icons/bolt.png" alt="انرژی"></div>
          <div class="ring" data-meter="cleanliness"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" cx="18" cy="18" r="15.5" stroke="#7FB8D8" stroke-dasharray="97.4" stroke-dashoffset="19.5" stroke-linecap="round"/></svg><img src="assets/icons/duck.png" alt="تمیزی"></div>
          <div class="ring" data-meter="affection"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" cx="18" cy="18" r="15.5" stroke="#E85D8A" stroke-dasharray="97.4" stroke-dashoffset="77.9" stroke-linecap="round"/></svg><img src="assets/icons/heart.png" alt="محبت"></div>
        </div>
        <div class="ring-cluster" id="rings-left">
          <div class="ring" data-meter="hunger"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" cx="18" cy="18" r="15.5" stroke="#E8913A" stroke-dasharray="97.4" stroke-dashoffset="63.3" stroke-linecap="round"/></svg><img src="assets/icons/drumstick.png" alt="گرسنگی"></div>
          <div class="ring" data-meter="happiness"><svg viewBox="0 0 36 36"><circle class="ring-bg" cx="18" cy="18" r="15.5"/><circle class="ring-fg" cx="18" cy="18" r="15.5" stroke="#F27EA9" stroke-dasharray="97.4" stroke-dashoffset="19.5" stroke-linecap="round"/></svg><img src="assets/icons/face-happy.png" alt="شادی"></div>
        </div>
      </div>
      <div class="rail">
        <button id="rail-shop" title="فروشگاه"><img src="assets/icons/bag.png" alt="فروشگاه"></button>
        <button id="rail-quests" title="ماموریت‌ها"><img src="assets/icons/trophy.png" alt="ماموریت‌ها"></button>
        <button id="rail-diary" title="دفتر خاطرات"><img src="assets/icons/bookshelf.png" alt="دفتر خاطرات"></button>
      </div>
      <div id="bubble"></div>
    </div>
  </div>

  <div class="dock">
    <button id="dock-feed"><span class="dock-ic"><img src="assets/icons/meal.png" alt=""></span><span>غذا</span></button>
    <button id="dock-play"><span class="dock-ic"><img src="assets/icons/gamepad.png" alt=""></span><span>بازی</span></button>
    <button id="dock-wash"><span class="dock-ic"><img src="assets/icons/duck.png" alt=""></span><span>حموم</span></button>
    <button id="dock-sleep"><span class="dock-ic"><img src="assets/icons/moon.png" alt=""></span><span>خواب</span></button>
    <button id="dock-praise"><span class="dock-ic"><img src="assets/icons/heart.png" alt=""></span><span>ناز</span></button>
  </div>

  <div class="chat-row">
    <button class="mic-btn" id="mic-btn" title="صدا"><img src="assets/icons/speaker.png" alt=""></button>
    <input id="chat-input" type="text" placeholder="به آستولفو چیزی بگو…" autocomplete="off">
    <button class="send-btn" id="chat-send" title="ارسال"><svg viewBox="0 0 24 24" fill="none" shape-rendering="crispEdges"><path d="M3 11 L21 3 L14 21 L11 13 Z" fill="#fff"/><path d="M11 13 L21 3" stroke="#F27EA9" stroke-width="1.6"/></svg></button>
    <div class="quiet-pill">آستولفو خوابه…</div>
    <button class="wake-pill" id="wake-btn">بیدارش کن</button>
  </div>

  <div class="today-strip" id="today-strip">
    <img src="assets/icons/bookshelf.png" alt="">
    <span id="today-text">روز ۱ — آستولفو تازه به اتاقش اومده!</span>
    <span class="streak" id="streak-text"></span>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="handle"></div>
    <header>
      <h2 id="sheet-title">فروشگاه</h2>
      <div class="pill coin-pill" id="sheet-coins"><img class="coin-ic" src="assets/icons/coin.png" alt="" style="width:16px;height:16px"> <span class="px-num" id="sheet-coins-val">20</span></div>
      <button class="x-btn" id="sheet-x" title="بستن"><img src="assets/icons/x.png" alt="بستن"></button>
    </header>
    <div class="sheet-body" id="sheet-body">

      <div class="sheet-panel" id="panel-shop">
        <div class="chips" id="shop-chips"></div>
        <div class="shop-grid" id="shop-grid"></div>
      </div>

      <div class="sheet-panel" id="panel-games">
        <div id="games-list"></div>
        <div class="sheet-foot" id="games-leaderboard"><img src="assets/icons/trophy.png" alt=""> جدول امتیازها</div>
      </div>

      <div class="sheet-panel" id="panel-quests"><div id="quests-list"></div></div>
      <div class="sheet-panel" id="panel-diary"><div id="diary-list"></div></div>
      <div class="sheet-panel" id="panel-leaderboard"><div id="leaderboard-list"></div></div>

      <div class="sheet-panel" id="panel-food"><div class="food-grid" id="food-grid"></div></div>

      <div class="sheet-panel" id="panel-settings">
        <div class="s-row"><span>صدا</span><button class="tog on" id="set-mute" aria-label="صدا"></button></div>
        <div class="s-row"><span>حرکت کمتر</span><button class="tog" id="set-motion" aria-label="حرکت کمتر"></button></div>
        <div class="s-row"><span>شب / روز اتاق</span><select id="set-daynight"><option value="auto">خودکار (ساعت تهران)</option><option value="day">روز</option><option value="night">شب</option></select></div>
        <div class="s-row"><span>پشتیبان (JSON)</span><span><button class="mini-btn" id="btn-export">دانلود</button> <button class="mini-btn" id="btn-import" style="background:rgba(74,59,71,.12);color:var(--ink)">بازگردانی</button><input type="file" id="import-file" accept="application/json" style="display:none"></span></div>
        <div class="s-row"><span>شروع دوباره</span><button class="mini-btn" id="btn-reset" style="background:rgba(74,59,71,.12);color:var(--ink)">ریست</button></div>
        <button id="install-btn">نصب روی صفحه‌ی اصلی</button>
      </div>

      <div class="sheet-panel" id="panel-star">
        <div class="play-area">
          <div class="status" id="star-status"></div>
          <canvas id="star-canvas" width="340" height="250"></canvas>
          <div class="row"><span class="pill">امتیاز <span class="px-num" id="star-score">0</span></span><span class="pill">زمان <span class="px-num" id="star-time">30</span></span></div>
          <div class="row"><button id="star-start">شروع</button><button class="ghost" id="star-quit">خروج</button></div>
        </div>
      </div>

      <div class="sheet-panel" id="panel-memory">
        <div class="play-area">
          <div class="status" id="memory-status"></div>
          <div class="memory-grid" id="memory-grid"></div>
          <div class="row"><span class="pill">حرکت <span class="px-num" id="memory-moves">0</span></span><button class="ghost" id="memory-quit">خروج</button></div>
        </div>
      </div>

      <div class="sheet-panel" id="panel-timing">
        <div class="play-area">
          <div class="status" id="timing-status"></div>
          <div class="timing-track"><div class="timing-zone" id="timing-zone"></div><div class="timing-marker" id="timing-marker" style="left:0%"></div></div>
          <div class="row"><span class="pill">دور <span class="px-num" id="timing-round">0/10</span></span><span class="pill">امتیاز <span class="px-num" id="timing-score">0</span></span></div>
          <div class="row"><button id="timing-tap">بزن!</button><button class="ghost" id="timing-quit">خروج</button></div>
        </div>
      </div>

      <div class="sheet-panel" id="panel-hideseek">
        <div class="play-area">
          <div class="status" id="hideseek-status"></div>
          <p style="font-size:14px;color:var(--muted)">آستولفو قایم شده! توی اتاق دنبالش بگرد — فقط ۲ شانس داری.</p>
          <div class="hide-spots">
            <button data-spot="curtain">پشت پرده‌ی پنجره</button>
            <button data-spot="shelf">پشت قفسه‌ی کتاب</button>
            <button data-spot="rug">زیر قالیچه</button>
          </div>
          <div class="row"><button class="ghost" id="hideseek-quit">خروج</button></div>
        </div>
      </div>

    </div>
    <div class="chat-sheet-input" id="chat-sheet-input" style="display:none">
      <input id="chat-input-sheet" type="text" placeholder="به آستولفو چیزی بگو…" autocomplete="off">
      <button id="chat-send-sheet" title="ارسال"><svg viewBox="0 0 24 24" fill="none" shape-rendering="crispEdges" style="width:22px;height:22px"><path d="M3 11 L21 3 L14 21 L11 13 Z" fill="#fff"/><path d="M11 13 L21 3" stroke="#F27EA9" stroke-width="1.6"/></svg></button>
    </div>
  </div>

  <div id="toast"></div>
</div>

<script src="lines.js"></script>
<script src="items-data.js"></script>
<!-- PIXEL MESH RIG v4 (2026-11-27): REVERTED from the vector rig — the owner
     rejected the style change outright («چرا کرکتر رو کلا عوض کردی»). The
     ORIGINAL pixel character is back, driven by the skeletal mesh rig
     (mesh-data.js + rig.js). ?v=4 cache-busts the phone so the vector
     build can never be served again. -->
<script src="mesh-data.js?v=4"></script>
<script src="rig.js?v=4"></script>
<script src="game.js"></script>
<script src="chat.js"></script>
<script>
  window.addEventListener('load', function () {
    if (window.Game) window.Game.init();
    if (window.Chat) window.Chat.init();
  });
</script>
</body>
</html>
