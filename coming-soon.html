<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>بزودی…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdeef5;
        --bg-dot: #f9d3e4;
        --ink: #4a2438;
        --ink-soft: #8a5570;
        --pink: #f27bab;
        --pink-deep: #d94f83;
        --pink-soft: #ffd9e9;
        --card: #fff7fb;
        --card-line: #f6bcd4;
        --stripe-a: #f78fb8;
        --stripe-b: #fff3f8;
        --shadow: rgba(190, 70, 120, 0.22);
        --bar-track: #fadce9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #22121d;
          --bg-dot: #331b2b;
          --ink: #fbe4ef;
          --ink-soft: #d69dbb;
          --pink: #f78fb8;
          --pink-deep: #ff9ec2;
          --pink-soft: #3d2233;
          --card: #2c1826;
          --card-line: #59304a;
          --stripe-a: #c4507f;
          --stripe-b: #2c1826;
          --shadow: rgba(0, 0, 0, 0.45);
          --bar-track: #452538;
        }
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Vazirmatn", system-ui, sans-serif;
        background: var(--bg);
        background-image: radial-gradient(var(--bg-dot) 2.2px, transparent 2.3px);
        background-size: 26px 26px;
        color: var(--ink);
        overflow-x: hidden;
      }

      /* نوار خطرِ صورتی — بالا و پایین صفحه، مثل دورِ محلِ کارگاه */
      .hazard {
        height: 22px;
        background: repeating-linear-gradient(
          -45deg,
          var(--stripe-a) 0 26px,
          var(--stripe-b) 26px 52px
        );
        box-shadow: 0 2px 10px var(--shadow);
      }
      .hazard.bottom { box-shadow: 0 -2px 10px var(--shadow); }

      main {
        min-height: calc(100dvh - 44px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 40px 20px 48px;
        position: relative;
      }

      /* ذره‌های شناور پس‌زمینه */
      .floaties { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .floaties span {
        position: absolute;
        color: var(--pink);
        opacity: 0.55;
        animation: drift linear infinite;
        user-select: none;
      }
      @keyframes drift {
        0% { transform: translateY(12vh) rotate(0deg); }
        100% { transform: translateY(-110vh) rotate(300deg); }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--card);
        border: 2px dashed var(--card-line);
        color: var(--pink-deep);
        font-weight: 800;
        font-size: 0.95rem;
        padding: 7px 18px;
        border-radius: 999px;
        margin-bottom: 26px;
      }
      .badge .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--pink);
        animation: blink 1.4s ease-in-out infinite;
      }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }

      .mascot-wrap {
        position: relative;
        width: min(320px, 72vw);
        margin-bottom: 8px;
      }
      .mascot-wrap::before {
        content: "";
        position: absolute;
        inset: 12% -6% -2% -6%;
        background: var(--pink-soft);
        border-radius: 50%;
        z-index: 0;
      }
      .mascot {
        position: relative;
        z-index: 1;
        width: 100%;
        height: auto;
        display: block;
        border-radius: 48% 52% 50% 50% / 42% 44% 56% 58%;
        animation: bob 3.2s ease-in-out infinite;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0) rotate(-1deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      .heart-pop {
        position: absolute;
        z-index: 2;
        pointer-events: none;
        animation: pop 0.9s ease-out forwards;
      }
      @keyframes pop {
        0% { transform: translateY(0) scale(0.4); opacity: 0; }
        20% { opacity: 1; }
        100% { transform: translateY(-90px) scale(1.25) rotate(14deg); opacity: 0; }
      }

      h1 {
        font-size: clamp(1.9rem, 6.5vw, 3.4rem);
        font-weight: 900;
        line-height: 1.5;
        margin: 18px 0 10px;
        max-width: 22ch;
      }
      h1 .hl {
        background: var(--pink-soft);
        border-radius: 14px;
        padding: 0 12px;
        box-decoration-break: clone;
        -webkit-box-decoration-break: clone;
      }
      .sub {
        color: var(--ink-soft);
        font-size: clamp(1rem, 3.4vw, 1.2rem);
        font-weight: 500;
        margin: 0 0 34px;
      }

      /* نوار پیشرفتِ نصب */
      .install {
        width: min(430px, 88vw);
        background: var(--card);
        border: 2px solid var(--card-line);
        border-radius: 20px;
        padding: 18px 20px 16px;
        box-shadow: 0 14px 34px var(--shadow);
      }
      .install-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-weight: 800;
        font-size: 0.98rem;
        margin-bottom: 10px;
      }
      .install-head .pct { color: var(--pink-deep); font-weight: 900; direction: ltr; }
      .track {
        height: 16px;
        background: var(--bar-track);
        border-radius: 999px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: repeating-linear-gradient(
          -45deg,
          var(--pink) 0 16px,
          var(--pink-deep) 16px 32px
        );
        background-size: 200% 100%;
        animation: slide 1.1s linear infinite;
        transition: width 0.5s ease;
      }
      @keyframes slide { from { background-position: 0 0; } to { background-position: 45px 0; } }
      .install-note {
        margin: 10px 0 0;
        font-size: 0.86rem;
        color: var(--ink-soft);
        min-height: 1.4em;
      }

      .cones {
        margin-top: 30px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
      }
      .cone { width: 34px; height: auto; }

      footer {
        margin-top: 26px;
        color: var(--ink-soft);
        font-size: 0.85rem;
        font-weight: 500;
      }

      @media (prefers-reduced-motion: reduce) {
        .mascot, .fill, .badge .dot, .floaties span { animation: none !important; }
      }
    </style>
  </head>

        <svg class="cone" viewBox="0 0 48 52" style="width:26px"><path d="M24 4 L38 42 L10 42 Z" fill="#f78fb8"/><path d="M17.5 27 L30.5 27 L33 34 L15 34 Z" fill="#fff3f8"/><rect x="6" y="42" width="36" height="6" rx="2" fill="#d94f83"/></svg>
        <svg class="cone" viewBox="0 0 48 52"><path d="M24 4 L38 42 L10 42 Z" fill="#f78a4b"/><path d="M17.5 27 L30.5 27 L33 34 L15 34 Z" fill="#fff3e8"/><rect x="6" y="42" width="36" height="6" rx="2" fill="#e06a2c"/></svg>
      </div>

      <footer>فعلاً همین. بعداً دوباره سر بزنید — شاید تا اون موقع نصبش تموم شده باشه.</footer>
    </main>

    <div class="hazard bottom" aria-hidden="true"></div>

    <script>
      // اعداد فارسی
      function faNum(n) {
        return String(n).replace(/\d/g, function (d) { return "۰۱۲۳۴۵۶۷۸۹"[d]; });
      }

      // نوار پیشرفت: جلو می‌ره، ولی دمِ افتتاح گیر می‌کنه — مثل همه‌ی نصب‌های دنیا
      var fill = document.getElementById("fill");
      var pct = document.getElementById("pct");
      var note = document.getElementById("note");
      var steps = [
        [12, "در حال باز کردن جعبه…"],
        [27, "در حال نصب گوش‌های گربه‌ای…"],
        [43, "در حال اتو کردن پلیور صورتی…"],
        [58, "در حال بستن روبان‌ها…"],
        [74, "در حال تنظیم جوراب‌های راه‌راه…"],
        [88, "تقریباً تمومه…"],
        [97, "فقط یه کم دیگه…"],
        [99, "۹۹٪ مونده سر جاش. همیشه همین‌طوره."]
      ];
      var i = 0;
      function advance() {
        if (i >= steps.length) return;
        var p = steps[i][0];
        fill.style.width = p + "%";
        pct.textContent = faNum(p) + "٪";
        note.textContent = steps[i][1];
        i++;
        setTimeout(advance, 1100 + Math.random() * 900);
      }
      setTimeout(advance, 700);

      // ذره‌های شناور: قلب و ستاره
      var floaties = document.getElementById("floaties");
      var glyphs = ["♡", "✦", "♥", "✧", "♡", "✦"];
      for (var k = 0; k < 14; k++) {
        var s = document.createElement("span");
        s.textContent = glyphs[k % glyphs.length];
        s.style.right = Math.random() * 96 + "%";
        s.style.top = 60 + Math.random() * 45 + "%";
        s.style.fontSize = 13 + Math.random() * 18 + "px";
        s.style.animationDuration = 9 + Math.random() * 10 + "s";
        s.style.animationDelay = -Math.random() * 12 + "s";
        floaties.appendChild(s);
      }

      // کلیک روی کاراکتر: قلب می‌پره بیرون
      var mascot = document.getElementById("mascot");
      var wrap = mascot.parentElement;
      mascot.addEventListener("click", function () {
        for (var j = 0; j < 5; j++) {
          var h = document.createElement("span");
          h.className = "heart-pop";
          h.textContent = j % 2 ? "✦" : "♥";
          h.style.color = j % 2 ? "#f2b04f" : "#f27bab";
          h.style.fontSize = 18 + Math.random() * 16 + "px";
          h.style.right = 30 + Math.random() * 55 + "%";
          h.style.top = 12 + Math.random() * 25 + "%";
          h.style.animationDelay = j * 0.07 + "s";
          wrap.appendChild(h);
          (function (el) { setTimeout(function () { el.remove(); }, 1200); })(h);
        }
      });
    </script>
  </body>
</html>
